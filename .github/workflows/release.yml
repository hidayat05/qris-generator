name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: qris-generator-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: qris-generator-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: qris-generator-macos-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            artifact_name: qris-generator-macos-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Build Binary (Windows)
        if: matrix.goos == 'windows'
        run: |
          go build -ldflags="-H=windowsgui" -o ${{ matrix.artifact_name }} main.go

      - name: Build Binary (Unix)
        if: matrix.goos != 'windows'
        run: |
          go build -o ${{ matrix.artifact_name }} main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: qris-generator-windows-amd64.exe
          path: ./artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: qris-generator-linux-amd64
          path: ./artifacts

      - name: Download macOS ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: qris-generator-macos-arm64
          path: ./artifacts

      - name: Download macOS AMD64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: qris-generator-macos-amd64
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/qris-generator-windows-amd64.exe
            ./artifacts/qris-generator-linux-amd64
            ./artifacts/qris-generator-macos-arm64
            ./artifacts/qris-generator-macos-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
